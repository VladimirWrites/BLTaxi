[versions]

lifecycleRuntimeCompose = "2.11.0"
versionCode = "30000"
versionName = "3.0.0"

minSdk = "23"
targetSdk = "36"
compileSdk = "37"

kotlin = "2.4.10"
ksp = "2.3.11"
coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"

android_x_app_compat = "1.7.1"
android_x_core_ktx = "1.19.0"
android_x_preference = "1.2.1"
android_x_startup = "1.2.0"
android_x_work_manager = "2.11.2"

activity = "1.13.0"
navigation = "2.9.8"
lifecycle = "2.11.0"

hilt = "2.60.1"
hilt-navigation-compose = "1.4.0"
hilt-work = "1.4.0"

retrofit = "3.0.0"
retrofit-kotlinx-serialization = "1.0.0"
ok_http_interceptor = "5.4.0"

room = "2.8.4"

firebase_core = "21.1.1"
firebase_analytics = "23.2.0"
firebase_crashlytics = "20.1.0"

junit = "4.13.2"
mockito-kotlin = "6.3.0"
mockito-inline = "5.2.0"
truth = "1.4.5"
arch_core_testing = "2.2.0"
robolectric = "4.16.1"
espresso_core = "3.7.0"
test_core_ktx = "1.7.0"
androidx_test_ext_junit = "1.3.0"
# 1.4.1 is the latest stable, but its Gradle plugin identifies the module type through
# AGP's legacy extension classes, which AGP 9 no longer exposes — it rejects :app with
# "not a supported android module". 1.5.0-beta01 reworked that detection.
benchmark = "1.5.0-beta01"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"

compose = "2026.06.01"
# Expressive components (ButtonGroup, MaterialShapes, LoadingIndicator) are not in the
# stable material3 the BOM pins; they ship in the 1.5 alpha line.
compose-material3 = "1.5.0-alpha25"
reorderable = "3.1.0"

gradle-android = "9.3.1"
google_services = "4.5.0"
crashlytics_gradle_plugin = "3.0.7"
detekt = "1.23.1"

[libraries]

kotlin-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "android_x_app_compat" }
core_ktx = { group = "androidx.core", name = "core-ktx", version.ref = "android_x_core_ktx" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "android_x_preference" }
work-manager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "android_x_work_manager" }
startup-runtime = { group = "androidx.startup", name = "startup-runtime", version.ref = "android_x_startup" }

retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
ok-http-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "ok_http_interceptor" }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

room_runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room_compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room_ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room_common = { group = "androidx.room", name = "room-common", version.ref = "room" }

firebase-core = { group = "com.google.firebase", name = "firebase-core", version.ref = "firebase_core" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics", version.ref = "firebase_analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics", version.ref = "firebase_crashlytics" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime"}
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"}
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core"}
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended"}

compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity"}
compose-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle"}
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Compose testing dependencies
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigation" }

reorderable = { group = "sh.calvin.reorderable", name = "reorderable", version.ref = "reorderable" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-test = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hilt-navigation-compose" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
mockito-inline = { group = "org.mockito", name = "mockito-inline", version.ref = "mockito-inline" }

arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "arch_core_testing" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso_core" }
espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espresso_core" }

truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "test_core_ktx" }
work-manager-test = { group = "androidx.work", name = "work-testing", version.ref = "android_x_work_manager" }

# Baseline profile generation
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx_test_ext_junit" }

# Gradle plugins (for buildscript classpath)
gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle-android" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }
ksp-gradle-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
google-services-plugin = { group = "com.google.gms", name = "google-services", version.ref = "google_services" }
firebase-crashlytics-plugin = { group = "com.google.firebase", name = "firebase-crashlytics-gradle", version.ref = "crashlytics_gradle_plugin" }
hilt-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
gradle-versions-plugin = { group = "com.github.ben-manes", name = "gradle-versions-plugin", version = "0.54.0" }
baselineprofile-gradle-plugin = { group = "androidx.benchmark", name = "benchmark-baseline-profile-gradle-plugin", version.ref = "benchmark" }
